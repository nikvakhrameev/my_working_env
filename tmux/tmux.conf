set -g mouse on                    
set -g base-index 1               
setw -g pane-base-index 1
set -g renumber-windows on         
set -g history-limit 50000
set -g default-terminal "tmux-256color"
set -g escape-time 10             

unbind C-b
set -g prefix C-a
bind C-a send-prefix

unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"   
bind - split-window -v -c "#{pane_current_path}"  

bind c new-window -c "#{pane_current_path}"

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind -n M-Left previous-window
bind -n M-Right next-window

# prefix + S — fuzzy-выбор сессии в попапе
bind S display-popup -w 85% -h 80% -E "\
  tmux list-sessions -F '#{session_name}' |\
  grep -v \"^$(tmux display-message -p '#S')\$\" |\
  fzf --reverse --ansi --preview '~/.tmux/session-preview.sh {}' --preview-window right,55% |\
  xargs -r tmux switch-client -t"

bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

bind r source-file ~/.tmux.conf \; display "Config reloaded"

set -g status-position bottom
set -g status-style bg=#2e3440,fg=#d8dee9

set -g status-left-length 20
set -g status-left "#[fg=#88c0d0,bold]#S #[fg=#d8dee9]| "

setw -g window-status-format " #I:#{?#{m:✳*,#{pane_title}},#[bg=#ebcb8b]#[fg=#2e3440]#[bold]#[blink],}#{?#{m:✳*,#{pane_title}},#{pane_title},#{?#{||:#{==:#{pane_title},},#{==:#{pane_title},#{host}}},#{pane_current_command},#{pane_title}}}#[default] "
setw -g window-status-current-format "#[bg=#88c0d0,fg=#2e3440,bold] #I:#{?#{||:#{==:#{pane_title},},#{==:#{pane_title},#{host}}},#{pane_current_command},#{pane_title}} "

set -g status-right-length 60
set -g status-right "#[fg=#81a1c1]#{b:pane_current_path}#[fg=#ebcb8b]#(cd \"#{pane_current_path}\" 2>/dev/null && git rev-parse --abbrev-ref HEAD 2>/dev/null | sed 's/^/ | /')"

setw -g monitor-activity on
set -g visual-activity off
set -g monitor-bell on
setw -g window-status-bell-style "blink,fg=black,bg=red,bold"
set -g status-interval 1

set -g allow-rename off

setw -g mode-keys vi
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"
bind-key -T copy-mode MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"

